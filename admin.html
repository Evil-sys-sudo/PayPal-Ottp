<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bluebast | Teacher Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fb;color:#183153;font-family:Arial,Helvetica,sans-serif;padding:20px}
main{max-width:760px;margin:40px auto;background:white;border:1px solid #e1e8f0;border-radius:16px;padding:28px;box-shadow:0 12px 32px #19365b12}
h1{text-align:center;font-size:24px}.intro{text-align:center;color:#5d6b80;font-size:14px;line-height:1.5}
label{display:block;font-weight:bold;font-size:14px;margin:20px 0 8px}input{width:100%;height:48px;border:1px solid #9baabd;border-radius:8px;padding:0 12px;font-size:16px}
button{border:0;border-radius:22px;background:#0757c9;color:white;font-weight:bold;padding:12px 18px;cursor:pointer}button:disabled{opacity:.6}
.row{display:flex;gap:8px}.row input{flex:1}.row button{white-space:nowrap}
#status{font-size:13px;margin:15px 0}.entry{border:1px solid #e1e8f0;border-radius:10px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.value{font-size:22px;font-weight:bold;letter-spacing:3px}.date{font-size:12px;color:#66758a;margin-top:8px}.delete{margin-top:10px;background:#5b6677;font-size:12px;padding:9px 13px}
@media(max-width:520px){.row{flex-direction:column}.row button{width:100%}main{padding:22px 16px}}
</style>
</head>
<body>
<main>
  <h1>Bluebast teacher dashboard</h1>
  <p class="intro">Enter the dashboard password you configured in Render to view submitted classroom entries.</p>
  <form id="login">
    <label for="password">Dashboard password</label>
    <div class="row">
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="load" type="submit">View entries</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="entries"></section>
</main>
<script>
const login = document.getElementById("login");
const password = document.getElementById("password");
const status = document.getElementById("status");
const entries = document.getElementById("entries");
const load = document.getElementById("load");

async function refresh() {
  status.textContent = "";
  entries.replaceChildren();
  load.disabled = true;
  try {
    const response = await fetch("/api/submissions", {
      headers: { "x-admin-password": password.value },
      cache: "no-store"
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load entries.");
    status.textContent = `${data.length} submission(s)`;
    if (!data.length) status.textContent = "No entries submitted yet.";
    for (const item of data) {
      const box = document.createElement("article");
      box.className = "entry";
      const value = document.createElement("div");
      value.className = "value";
      value.textContent = item.number;
      const date = document.createElement("div");
      date.className = "date";
      date.textContent = new Date(item.submittedAt).toLocaleString();
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "Delete entry";
      remove.addEventListener("click", async () => {
        const result = await fetch(`/api/submissions/${encodeURIComponent(item.id)}`, {
          method: "DELETE",
          headers: { "x-admin-password": password.value }
        });
        if (result.ok) refresh();
        else status.textContent = "Could not delete entry.";
      });
      box.append(value, date, remove);
      entries.appendChild(box);
    }
  } catch (error) {
    status.textContent = error.message;
  } finally {
    load.disabled = false;
  }
}
login.addEventListener("submit", event => { event.preventDefault(); refresh(); });
</script>
</body>
</html>
